# Drop-in for rutracker-torrent-mcp.service: the MCP owns Chromium.
#
# It launches the browser on the shared persistent profile at the first tool call
# and stops it once idle, so nothing runs between searches. rutracker-browser.service
# is no longer required — it stays around only for manual VNC logins, and the MCP
# attaches to it over CDP whenever the operator has it running.
[Unit]
After=rutracker-browser-xvfb.service
Requires=rutracker-browser-xvfb.service

[Service]
# Xvfb's socket lives in the host /tmp; a private /tmp hides the display.
PrivateTmp=false
Environment=DISPLAY=:99
Environment=HOME=/var/lib/rutracker-browser/home
Environment=PLAYWRIGHT_BROWSERS_PATH=/var/lib/rutracker-browser/playwright
Environment=RUTRACKER_BROWSER_PROFILE=/var/lib/rutracker-browser/profile
Environment=RUTRACKER_BROWSER_PROXY_URL=socks5://127.0.0.1:1080
ReadWritePaths=/tmp /var/lib/rutracker-browser
# Chromium now lives in this cgroup; the host has 3.8 GiB (2026-08-13 OOM).
MemoryHigh=1G
MemoryMax=1500M
