# Cloudflare-challenge hand-off page: HTTPS front for the loopback noVNC
# (127.0.0.1:6080), gated by deploy/challenge-gate.py (127.0.0.1:6079).
# Install to /etc/nginx/sites-available/ + symlink into sites-enabled/.
# Cert: certbot certonly --webroot -w /var/www/html -d rtcc.wildcar.org
#
# Access model: the Telegram bot mints a one-time token; /enter/<token>
# converts it into a session cookie; auth_request checks the cookie on every
# other request. Everything unauthorized is a 404 — to a scanner the host
# looks empty. VNC/noVNC/CDP themselves stay loopback-only.

server {
    listen 80;
    listen [::]:80;
    server_name rtcc.wildcar.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on;` needs nginx 1.25+; this host runs 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rtcc.wildcar.org;

    ssl_certificate     /etc/letsencrypt/live/rtcc.wildcar.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtcc.wildcar.org/privkey.pem;

    # auth_request subrequest — the gate reads the rt_challenge cookie from
    # the inherited headers.
    location = /gate {
        internal;
        proxy_pass http://127.0.0.1:6079/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Tokenised entry link from the Telegram button: validates the token,
    # sets the cookie, redirects to /vnc.html.
    location /enter/ {
        proxy_pass http://127.0.0.1:6079;
    }

    location / {
        auth_request /gate;
        error_page 401 403 = @deny;

        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The VNC websocket is long-lived; the 60s default would cut the
        # session mid-challenge.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location @deny {
        return 404;
    }
}
